;===============================================================================
; Star Wars Zero Company - Lossless Performance + Clean Visuals (UPDATED)
;
; Path: %LOCALAPPDATA%\SWZeroCompany\Saved\Config\Windows\Engine.ini
;
; Comment key:
;   [PERF]   = improves FPS / reduces GPU load
;   [STUTTER]= reduces hitches / 1% lows
;   [NEUTRAL]= no meaningful performance impact
;   [COST]   = adds overhead (kept for visual/functional reasons)
;===============================================================================

[SystemSettings]
; ==============================================================================
; 1. CORE SHADER CACHE & DIRECTX 12 DISK PIPELINE (COMBINED LOOP)
; ==============================================================================
r.ShaderPipelineCache.Enabled=1
; [STUTTER] Caches compiled shaders to disk; avoids mid-game compile hitches

D3D12.PSO.DiskCache=1
; [STUTTER] Persists pipeline state objects between sessions; skips re-creation

D3D12.PSO.DriverOptimizedDiskCache=1
; [STUTTER] Uses driver-optimized cache format; faster PSO lookup on load

r.CreateShadersOnLoad=1
; [COST] Forces ALL shaders to compile before first frame → long initial hitch.
;       Reduces mid-game stutter but adds 30s–2min to launch on lower-end GPUs.

r.ShaderPipelineCache.BackgroundPrecompilation=1
; [STUTTER] Compiles remaining shaders in background instead of blocking gameplay

r.ShaderPipelineCache.PreCompileBackgroundThreadPriority=2
; [NEUTRAL] Sets thread priority for background compilation; avoids stealing CPU from game

r.ShaderPipelineCache.BatchSize=100
; [NEUTRAL] Number of shaders compiled per batch; higher = faster but more CPU spikes

r.ShaderPipelineCache.ReportTimeMS=50
; [NEUTRAL] Logging interval; no performance impact

; --- Additional shader cache improvements ---
r.ShaderPipelineCache.PreOptimizeEnabled=1
; [STUTTER] Pre-optimizes shader permutations; reduces first-use compile time

r.ShaderPipelineCache.StartupMode=3
; [STUTTER] Aggressive startup mode; loads and validates cache as fast as possible

r.ShaderPipelineCache.LazyLoadShadersWhenPSOCacheIsPresent=1
; [STUTTER] Defers shader load until actually needed if cache exists; avoids wasted work

r.PSOPrecaching=1
; [STUTTER] Pre-caches pipeline state objects at level load; prevents draw-call hitches

r.pso.CreateOnRHIThread=true
; [STUTTER] Moves PSO creation off render thread; reduces frame-time spikes

r.SkinCache.CompileShaders=1
; [STUTTER] Pre-compiles skinning shaders; prevents hitch when first skinned mesh appears

; XGE Shader Compilation (Windows 11 only, safe to ignore on Win 10)
r.XGEShaderCompile=1
; [STUTTER] Offloads shader compilation to Windows 11's XGE parallel compiler

r.XGEShaderCompile.Mode=1
; [NEUTRAL] Selects XGE operating mode (1 = standard)

r.XGEShaderCompile.Xml.BatchGroupSize=256
; [NEUTRAL] XGE batch grouping; tuning value, no direct perf impact

r.XGEShaderCompile.Xml.BatchSize=16
; [NEUTRAL] XGE per-batch size; tuning value

r.XGEShaderCompile.Xml.JobTimeout=0.500000
; [NEUTRAL] Timeout per XGE job; prevents stuck compilation

; ==============================================================================
; 2. VRAM TEXTURE STREAMING POOL ALLOCATIONS & CPU SMOOTHING
; ==============================================================================
r.TextureStreaming=1
; [PERF] Enables texture streaming; allows engine to manage VRAM dynamically

; Active selection for RTX 4090 (12GB streaming target)
; r.Streaming.PoolSize=12288
; [COST] 12 GB pool is sized for a 16 GB card. On 4–8 GB VRAM this causes
;       constant texture swapping to system RAM → severe stuttering.
;       UNCOMMENT AND SET: 4GB=2048, 6GB=3072, 8GB=5120, 12GB=9216, 16GB=12288

r.Streaming.AllowParallelStreamingRenderAssets=1
; [STUTTER] Streams textures in parallel with rendering; hides load behind GPU work

r.Streaming.OverlapAssetAndLevelTicks=1
; [STUTTER] Overlaps level tick updates with asset streaming; reduces main-thread stalls

; FIX FOR CPU SIDE PIPELINE STUTTER:
; Prevents rapid asset destruction/rebuild cycles during sudden cinematic camera cuts.
r.Streaming.GCPoolSize=2048
; [STUTTER] Larger GC pool for streaming; prevents allocation hitches during camera cuts

r.Streaming.MaxNumSlowFrameFrames=5
; [STUTTER] Tolerates up to 5 slow frames before forcing quality drop; avoids aggressive downscaling

; --- Additional streaming improvements ---
r.Streaming.Boost=1
; [STUTTER] Boosts streaming priority during level transitions; reduces pop-in

r.Streaming.AmortizeCPUToGPUCopy=1
; [STUTTER] Spreads CPU→GPU texture copies across multiple frames; prevents single-frame spikes

r.Streaming.MaxNumTexturesToStreamPerFrame=4
; [STUTTER] Limits textures streamed per frame; prevents burst allocation hitches

r.Streaming.NumStaticComponentsProcessedPerFrame=200
; [STUTTER] Limits static mesh registration per frame; avoids CPU spikes on level load

r.Streaming.FramesForFullUpdate=1
; [NEUTRAL] Full streaming update every frame; lower = less responsive but smoother

r.Streaming.MinMipForSplitRequest=0
; [NEUTRAL] Minimum mip level for split texture requests; 0 = no split (simplest)

r.Streaming.HLODStrategy=2
; [PERF] Uses HLOD (hierarchical LOD) strategy 2; reduces draw calls at distance

r.VT.PoolSizeScale=48
; [PERF] Scales virtual texture pool; larger = fewer VT page faults (GPU memory)

; --- Async loading & level streaming ---
s.AsyncLoadingThreadEnabled=1
; [STUTTER] Enables async loading thread; moves asset loading off main thread

s.AsyncLoadingTimeLimit=4
; [STUTTER] Limits async loading to 4ms/frame; prevents load from eating entire frame

s.LevelStreamingActorsUpdateTimeLimit=4
; [STUTTER] Limits level actor updates to 4ms/frame; prevents registration hitches

s.UnregisterComponentsTimeLimit=4
; [STUTTER] Limits component unregistration to 4ms/frame; smooths level transitions

s.AsyncLoadingUseFullTimeLimit=0
; [NEUTRAL] 0 = use per-frame limit instead of full time budget

s.MinBulkDataSizeForAsyncLoading=0
; [NEUTRAL] Minimum size for async bulk load; 0 = all assets use async path

s.PriorityAsyncLoadingExtraTime=0
; [NEUTRAL] Extra time budget for priority loads; 0 = no extra

s.PriorityLevelStreamingActorsUpdateExtraTime=0
; [NEUTRAL] Extra time for priority level updates; 0 = no extra

s.MaxIncomingRequestsToStall=1
; [STUTTER] Limits how many incoming requests can stall the main thread

s.MaxReadyRequestsToStallMB=0
; [NEUTRAL] Max MB of ready requests allowed to stall; 0 = unlimited

s.LevelStreamingComponentsRegistrationGranularity=10
; [STUTTER] Registers 10 components per tick; smooths level load spikes

s.LevelStreamingComponentsUnregistrationGranularity=30
; [STUTTER] Unregisters 30 components per tick; smooths level exit spikes

s.IoDispatcherCacheSizeMB=2048
; [STUTTER] 2 GB IO dispatcher cache; reduces disk read hitches during streaming

; ==============================================================================
; 3. VISUAL CLARITY & CINEMATIC STRIPPING
; ==============================================================================
r.DefaultFeature.MotionBlur=0
; [PERF] Disables motion blur entirely; removes full-screen post-process pass

r.MotionBlurQuality=0
; [PERF] Motion blur quality off; no GPU cost even if re-enabled elsewhere

r.MotionBlur.Amount=0
; [PERF] Zero blur intensity; redundant with above but ensures no residual cost

r.MotionBlur.Max=0
; [PERF] Max blur radius zero; no sampling cost

r.MotionBlur.Scale=0
; [PERF] Blur scale zero; no resolution scaling cost

r.DepthOfFieldQuality=0
; [PERF] Disables depth of field; removes bokeh post-process pass

r.SceneColorFringeQuality=0
; [PERF] Disables chromatic aberration; removes per-pixel color offset pass

r.SceneColorFringe.Max=0
; [PERF] Zero fringe max; no residual cost

r.FilmGrain=0
; [PERF] Disables film grain; removes per-pixel noise generation pass

r.Tonemapper.Quality=1
; [PERF] Lower-quality tonemapper (1 vs 2–3); reduces per-pixel math

; ==============================================================================
; 4. LUMEN GLOBAL ILLUMINATION & RAY RECONSTRUCTION (FLICKER RESOLUTION)
; ==============================================================================
; Hand over all denoising tasks directly to DLSS Ray Reconstruction (Mode 2)
r.NGX.DLSS.denoisermode=2
; [PERF] Uses DLSS Ray Reconstruction for denoising; offloads to dedicated DLSS hardware
;       (RTX 30xx+ only; on AMD/Intel this falls back to software = [COST])

; Disable native UE denoisers to stop them from fighting DLSS on camera cuts
r.Shadow.Denoiser=0
; [PERF] Disables native shadow denoiser; removes redundant GPU pass

r.Lumen.Reflections.BilateralFilter=0
; [PERF] Disables bilateral filter on reflections; removes per-pixel filtering cost

; Retain high-end lumen tracking
r.Lumen.Reflections.ScreenSpaceReconstruction=1
; [COST] Screen-space reconstruction is GPU-heavy; biggest Lumen cost after RT.
;       On 4–8 GB VRAM cards this is a major FPS drain. Set to 0 for a big gain.

r.lumen.Reflections.Temporal=1
; [COST] Temporal accumulation adds a history buffer + blend pass per frame.
;       Required for Lumen reflections to look stable, but adds VRAM + GPU cost.

r.Lumen.Reflections.Allow=1
; [COST] Enables Lumen reflections entirely. THE single most expensive feature
;       in this config. On lower-end GPUs set to 0 for the largest FPS gain.

; --- Shadow cache (reduces per-frame shadow re-computation) ---
r.Shadow.CachePreshadow=1
; [STUTTER] Caches shadow pre-pass per scene; avoids recomputing every frame

; ==============================================================================
; 5. INPUT FIXES
; ==============================================================================
RegisterMouseVelocity=0
; [NEUTRAL] Disables OS mouse acceleration; no GPU/CPU performance impact

m_rawinput=1
; [NEUTRAL] Uses raw input API; slightly lower CPU overhead than polled input

; ==============================================================================
; 5. FOV
; ==============================================================================
fov=105
; [COST] 105° FOV renders significantly more of the scene per frame than 90°.
;       Increases fill-rate and object count. Reduce to 90–95 on lower-end GPUs.

r.FOV.DistanceScale=1.15
; [COST] Scales FOV with distance (wider when moving fast). Adds variable
;       rendering cost. Set to 1.0 to disable the dynamic widening.

; ==============================================================================
; 6. CPU-GPU SYNCHRONIZATION & FRAME PIPELINING
; ==============================================================================
; Smooths 1% low frametimes by controlling how CPU feeds frames to GPU
r.GTSyncType=1
; [STUTTER] GPU thread sync type 1; improves CPU→GPU handoff timing

r.OneFrameThreadLag=1
; [STUTTER] Adds 1 frame of thread lag; smooths 1% lows at the cost of ~1 frame
;       input latency. Set to 0 if input feels sluggish.

; --- Async render thread updates ---
AllowAsyncRenderThreadUpdates=1
; [STUTTER] Allows render thread to update asynchronously; reduces CPU→GPU bubbles

AllowAsyncRenderThreadUpdatesDuringGamethreadUpdates=1
; [STUTTER] Allows async render updates even during game thread updates; maximizes overlap

; --- Async tick dispatch (reduces main thread load) ---
tick.AllowAsyncComponentTicks=1
; [STUTTER] Ticks components on worker threads; reduces main-thread load

tick.AllowConcurrentTickQueue=1
; [STUTTER] Allows concurrent tick queue processing; parallelizes component ticks

tick.AllowAsyncTickDispatch=1
; [STUTTER] Dispatches ticks asynchronously; reduces main-thread stall time

; ==============================================================================
; 7. GARBAGE COLLECTION TUNING
; ==============================================================================
; Prevents GC from causing frame hitches during level streaming
s.ForceGCAfterLevelStreamedOut=0
; [STUTTER] Disables forced GC after level unload; prevents hitch on level exit

s.ContinuouslyIncrementalGCWhileLevelsPendingPurge=0
; [STUTTER] Disables continuous incremental GC during level purge; avoids spread-out hitches

; --- GC interval tuning ---
gc.TimeBetweenPurgingPendingKillObjects=30
; [STUTTER] Purges dead objects every 30s instead of per-frame; reduces GC frequency

gc.NumRetriesBeforeForcingGC=5
; [STUTTER] Retries GC 5 times before forcing; avoids aggressive full GC hitches

gc.MinDesiredObjectsPerSubTask=20
; [NEUTRAL] Minimum objects per GC sub-task; tuning value for GC granularity

gc.CreateGCClusters=1
; [STUTTER] Creates GC clusters; allows parallel garbage collection

gc.MultithreadedDestructionEnabled=1
; [STUTTER] Destroys objects on multiple threads; reduces destruction hitches

; ==============================================================================
; 8. MISC PERFORMANCE
; ==============================================================================
; Discards unused quality switches (saves GPU/CPU cycles)
r.DiscardUnusedQuality=1
; [PERF] Discards unused quality switch data; frees small amounts of VRAM/CPU

; Better occlusion culling
r.HZBOcclusion=2
; [PERF] HZB occlusion mode 2 (best); culls hidden geometry before rendering

; Disable DBuffer (helps on many hardware configs)
r.DBuffer=0
; [PERF] Disables DBuffer material system; reduces VRAM and bandwidth on most GPUs

; Disable GPU crash debugging overhead
r.GPUCrashDebugging=0
; [PERF] Disables GPU crash debug instrumentation; removes hidden overhead

r.DumpGPU=0
; [PERF] Disables GPU state dumping; no overhead in production

; Fast particle pool
r.Emitter.FastPoolEnable=1
; [STUTTER] Uses fast particle pool allocation; reduces hitching during particle bursts

; D3D12 zero buffer (supports higher mip streaming, reduces hitching)
D3D12.ZeroBufferSizeInMB=12
; [STUTTER] 12 MB zero buffer for D3D12; reduces page faults during texture streaming

; Force CPU access to GPU skin verts (reduces skinning stutters)
r.bForceCPUAccessToGPUSkinVerts=1
; [STUTTER] Forces CPU-side access to GPU skin vertices; prevents skinning hitches
;       when GPU writes skin data (can cause sync stalls)   
